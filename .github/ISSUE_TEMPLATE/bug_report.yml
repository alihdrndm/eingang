name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use fictional data only. Never attach real invoices, IBANs or personal data. Security problems go to the private report form instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the sandbox\n2. Upload ...\n3. ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Live demo, or a local setup (commit, OS, browser)?
    validations:
      required: true
