name: CI

on:
  # Pull requests run on pull_request; push covers main after a merge. Branches pushed
  # without a pull request get no CI.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLM_ENABLED: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    # Corpus download on a cold cache plus the full test suite with coverage.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eingang
          POSTGRES_USER: eingang
          POSTGRES_PASSWORD: eingang
        ports:
          - 5452:5432
        options: >-
          --health-cmd "pg_isready -U eingang -d eingang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eingang:eingang@localhost:5452/eingang
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --extra worker
      - name: Lint
        run: uv run poe lint
      - name: Typecheck
        run: uv run poe typecheck
      # The pinned ZUGFeRD corpus (about 150 MB) is downloaded once and cached by its commit.
      - name: Cache the ZUGFeRD corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/corpus
          key: zugferd-corpus-d891458e9822e34271a5438497bf924e89955979
      - name: Fetch the ZUGFeRD corpus
        run: uv run poe fetch-corpus
      - name: Test
        run: uv run poe test
      - name: OpenAPI freshness
        run: uv run poe openapi-check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install backend dependencies (for the OpenAPI export)
        working-directory: backend
        run: uv sync --frozen --extra worker
      - name: Lint
        run: pnpm --filter frontend lint
      - name: Typecheck
        run: pnpm --filter frontend typecheck
      - name: Unit tests
        run: pnpm --filter frontend test
      - name: Generated API types freshness
        run: node scripts/gen-api.mjs --check
      - name: Build
        run: pnpm --filter frontend build

  # Fails a pull request that adds a dependency with a known high or critical advisory. It
  # compares the dependency graph of the base and head commits through the GitHub API, so it
  # needs no checkout and no secret.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Builds the api, worker and web images without a layer cache before the smoke tests.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Smoke tests
        run: pnpm test:e2e
      # Playwright keeps a trace of every failed test (frontend/playwright.config.ts); open it
      # with `pnpm --filter frontend exec playwright show-trace <trace.zip>`.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
